services:
  instance:
    image: ${HOYOUTILS_IMAGE:-ghcr.io/ste94pz/hoyoutils:local}
    build:
      context: .
    # The registry may not exist yet. Build locally by default.
    pull_policy: build
    restart: on-failure:5
    # Retained so migration does not silently create a second account worker.
    container_name: hoyolab-auto
    network_mode: bridge
    volumes:
      - ./config.json5:/app/config.json5:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      TZ: ${TZ:-Asia/Shanghai}
