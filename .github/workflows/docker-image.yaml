name: Docker image

# Migration never publishes on push or release creation.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested Git tag (vMAJOR.MINOR.PATCH)
        type: string
        required: true
      publish:
        description: Publish to GHCR (requires HOYOUTILS_PUBLISH_ENABLED repository variable)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hoyoutils-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release and publication intent
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
          REPOSITORY: ${{ github.repository }}
          ENABLED: ${{ vars.HOYOUTILS_PUBLISH_ENABLED }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "$PUBLISH" == "true" ]]; then
            [[ "$REPOSITORY" == "ste94pz/hoyoutils" && "$ENABLED" == "true" ]] || exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: git diff --exit-code

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both architectures; publish only when requested
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.publish }}
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/ste94pz/hoyoutils:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.title=HoYoUtils
            org.opencontainers.image.description=Unofficial automation and utility toolkit for HoYoverse games.
            org.opencontainers.image.source=https://github.com/ste94pz/hoyoutils
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
